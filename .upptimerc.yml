owner: barnfront-com
repo: upptime

# Our app edge only accepts US traffic. GitHub-hosted runners sometimes land
# outside the US and get a 403, which shows up as a false outage, so every
# workflow runs on our self-hosted US runner (registered with this label).
runner: upptime-us

sites:
  - name: Web app
    url: https://app.barnfront.com
  - name: Marketing site
    url: https://barnfront.com
  # URL comes from the DEV_URL repo secret so the hostname stays out of this
  # public repo and off the status page.
  - name: Dev
    url: $DEV_URL
  # - name: API
  #   url: https://app.barnfront.com/api/health
  #   # TODO: uncomment once backend health endpoint is exposed in prod

status-website:
  cname: status.barnfront.com
  name: Barnfront Status
  introTitle: "**Barnfront** service status"
  introMessage: Live status for Barnfront services.
  navbar:
    - title: Status
      href: /
    - title: Barnfront
      href: https://barnfront.com
